name: Tay Tweaks Test Build
on:
  workflow_dispatch:
    inputs:
      source_branch:
        description: Branch to compile
        required: true
        default: v6-release-candidate
        type: string
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout selected source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_branch }}
      - name: Install PS2EXE
        shell: pwsh
        run: |
          Install-Module ps2exe -Scope CurrentUser -Force
          Import-Module ps2exe
      - name: Compile Tay Tweaks
        shell: pwsh
        run: |
          if (!(Test-Path ./TayTweaks.ps1)) { throw 'Missing TayTweaks.ps1' }
          Invoke-PS2EXE -inputFile ./TayTweaks.ps1 -outputFile ./TayTweaks.exe -noConsole -requireAdmin -title 'Tay Tweaks' -product 'Tay Tweaks' -version '6.0.0.0'
          if (!(Test-Path ./TayTweaks.exe)) { throw 'Build produced no EXE' }
      - name: Upload EXE for testing
        uses: actions/upload-artifact@v4
        with:
          name: TayTweaks-v6-Test
          path: TayTweaks.exe
          if-no-files-found: error
