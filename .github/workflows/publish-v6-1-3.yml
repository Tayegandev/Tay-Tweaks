name: Publish Tay Tweaks v6.1.3
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type PUBLISH_V613 after testing the v6.1.3 CI artifact on Windows"
        type: string
        required: true
permissions:
  contents: write
concurrency:
  group: taytweaks-v613-release
  cancel-in-progress: false
jobs:
  publish:
    if: ${{ inputs.confirmation == 'PUBLISH_V613' }}
    runs-on: windows-latest
    steps:
      - name: Checkout reviewed v6.1.3 source
        uses: actions/checkout@v4
        with:
          ref: v6.1.3-display-and-60
          path: source
      - name: Checkout live manifest
        uses: actions/checkout@v4
        with:
          ref: main
          path: stable
      - name: Validate source, build and hash
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          foreach($path in @('./source/TayTweaks.ps1','./source/Build-TayTweaks-EXE.ps1','./source/TayUpdater.ps1')) {
            $tokens=$null;$errors=$null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path),[ref]$tokens,[ref]$errors)
            if($errors.Count){throw "Invalid PowerShell source: $path"}
          }
          if((Get-Content ./source/TayTweaks.ps1 -Raw) -notmatch '\$script:AppVersion=\[version\]''6\.1\.3'''){throw 'Version mismatch'}
          Install-Module ps2exe -Scope CurrentUser -Force
          & ./source/Build-TayTweaks-EXE.ps1
          if(!(Test-Path source/TayTweaks.exe)){throw 'Build failed'}
          $hash=(Get-FileHash source/TayTweaks.exe -Algorithm SHA256).Hash
          if($hash -notmatch '^[A-Fa-f0-9]{64}$'){throw 'Invalid SHA-256'}
          "TAY_HASH=$hash" >> $env:GITHUB_ENV
      - name: Create GitHub stable release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          gh release create v6.1.3 source/TayTweaks.exe source/TayUpdater.ps1 source/TayTweaks.ico --repo ${{ github.repository }} --target v6.1.3-display-and-60 --title 'Tay Tweaks v6.1.3' --notes 'Display Manager with supported mode validation and confirmation rollback, plus 60 new opt-in niche Windows customizations. Back up settings before applying changes.'
      - name: Update live v6.1.2 updater feed
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $manifest=[ordered]@{
            version='6.1.3'
            download_url='https://github.com/${{ github.repository }}/releases/download/v6.1.3/TayTweaks.exe'
            sha256=$env:TAY_HASH
            changelog='https://github.com/${{ github.repository }}/releases/tag/v6.1.3'
            mandatory=$false
          }
          $manifest|ConvertTo-Json|Set-Content -Path stable/latest.json -Encoding utf8
          git -C stable config user.name 'github-actions[bot]'
          git -C stable config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C stable add latest.json
          git -C stable commit -m 'Publish Tay Tweaks v6.1.3 update manifest'
          git -C stable push origin HEAD:main
