name: Publish Tay Tweaks v8.1.1
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-v8-1-1.yml']
permissions:
  contents: write
concurrency:
  group: taytweaks-release-v811
  cancel-in-progress: false
jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v8.1.1-responsive-usage
          path: source
      - uses: actions/checkout@v4
        with:
          ref: main
          path: stable
          persist-credentials: true
      - name: Validate source and build EXE
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          foreach($file in @('TayTweaks.ps1','TayUpdater.ps1','Build-TayTweaks-EXE.ps1')){
            $tokens=$null;$errors=$null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path "source/$file"),[ref]$tokens,[ref]$errors)
            if($errors.Count){throw "Syntax error in $file"}
          }
          $src=Get-Content source/TayTweaks.ps1 -Raw
          if($src -notmatch '\$script:AppVersion=\[version\]''8\.1\.1'''){throw 'Version mismatch'}
          if($src -match 'Tab "Display Manager"'){throw 'Display Manager page must not ship in v7'}
          if($src -notmatch 'function UpdateUsageSpecs'){throw 'Missing hardware detection'}
          if($src -notmatch 'AddTayCaptionButton'){throw 'Missing custom Windows frame buttons'}
          if($src -match 'MaximizedBounds'){throw 'Protected MaximizedBounds property remains'}
          if($src -notmatch 'function SetTayDashboardLayout'){throw 'Responsive Usage layout missing'}
          if($src -match 'AutoScrollMinSize=\[Drawing.Size\]::new\(858,588\)'){throw 'Legacy fixed Usage viewport remains'}
          Install-Module ps2exe -Scope CurrentUser -Force
          & ./source/Build-TayTweaks-EXE.ps1
          if(!(Test-Path source/TayTweaks.exe)){throw 'Missing built EXE'}
          $hash=(Get-FileHash source/TayTweaks.exe -Algorithm SHA256).Hash
          "TAY_HASH=$hash" >> $env:GITHUB_ENV
          Compress-Archive -Path source/TayTweaks.exe,source/TayUpdater.ps1,source/TayTweaks.ico -DestinationPath TayTweaks-v8.1.1.zip -Force
      - name: Publish release with full package
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          gh release create v8.1.1 source/TayTweaks.exe source/TayUpdater.ps1 source/TayTweaks.ico TayTweaks-v8.1.1.zip --repo ${{ github.repository }} --target v8.1.1-responsive-usage --title 'Tay Tweaks v8.1.1' --notes 'Responsive Usage tab update: CPU GPU and RAM cards expand evenly across the available width; System and Activity History fill the remaining space; chart coordinates, label widths and progress tracks resize with the window. Retains Windows-style title controls, themes, hardware detection, restore, update system and optional tweaks. Compiled through GitHub Actions; runtime control behavior has not been independently verified on a Windows desktop. Existing opt-in tweak catalogue, rollback, presets, update system and other pages are preserved. Compiled by GitHub Actions. Not independently tested on a Windows PC. For a fresh install download the ZIP and keep TayUpdater.ps1 beside the EXE.'
      - name: Verify release asset exists
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          gh release view v8.1.1 --repo ${{ github.repository }} --json assets --jq '.assets[].name' | Tee-Object -Variable names
          if('TayTweaks.exe' -notin @($names)){throw 'Release EXE missing'}
      - name: Update stable updater feed
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $manifest=[ordered]@{
            version='8.1'
            download_url='https://github.com/${{ github.repository }}/releases/download/v8.1.1/TayTweaks.exe'
            sha256=$env:TAY_HASH
            changelog='https://github.com/${{ github.repository }}/releases/tag/v8.1.1'
            mandatory=$false
          }
          $manifest | ConvertTo-Json | Set-Content stable/latest.json -Encoding utf8
          git -C stable config user.name 'github-actions[bot]'
          git -C stable config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C stable add latest.json
          git -C stable commit -m 'release: publish v8.1.1 updater manifest'
          git -C stable push origin HEAD:main
