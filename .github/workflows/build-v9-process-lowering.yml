name: Build Tay Tweaks v9 Process Lowering Preview
# Includes optimized preset selection batching to prevent UI hangs
on:
  push:
    branches: [main]
    paths: ['.github/workflows/build-v9-process-lowering.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout v9 draft
        uses: actions/checkout@v4
        with:
          ref: v9-process-lowering-preview
      - name: Validate PowerShell and tweak catalogue
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          foreach($file in @('TayTweaks.ps1','Build-TayTweaks-EXE.ps1','TayUpdater.ps1')){
            $tokens=$null;$errors=$null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file),[ref]$tokens,[ref]$errors)
            if($errors.Count){$errors | Out-String | Write-Host;throw "Syntax error in $file"}
          }
          $source=Get-Content TayTweaks.ps1 -Raw
          $newIds=@([regex]::Matches($source, "Id='v9_[a-z0-9_]+'")).Count
          $allIds=@([regex]::Matches($source, "Id=['\x22][^'\x22]+['\x22];Name=")).Count
          Write-Host "New v9 tweaks: $newIds; all tweak definitions: $allIds"
          if($newIds -ne 40){throw 'Expected 40 unique v9 tweaks'}
          if($allIds -ne 157){throw 'Expected original 113, plus 40 extras and 4 process tweaks'}
          if($source -notmatch 'Universal / Extra Tweaks'){throw 'Missing v9 section'}
          if(@([regex]::Matches($source, "Id='v9pl_[a-z0-9_]+'" )).Count -ne 4){throw 'Missing four Process Lowering tweaks'}
          foreach($test in @('SetTayProcessToolbar', 'TayProcessStartup', 'TayProcessCpu', 'TayProcessTaskManager')){if($source -notmatch [regex]::Escape($test)){throw "Missing Process Lowering UI control: $test"}}
          foreach($term in @('SetTayTweakSelections','TayTweakSearch','TayTweakCategory','TayTweakCard_','Large batch warning')){if($source -notmatch [regex]::Escape($term)){throw "Missing UI feature: $term"}}
          foreach($test in @('SetTayTweakCardWidths', 'Get-CimInstance Win32_VideoController', '900', 'installed', 'TayTweakWidthBusy')){if($source -notmatch [regex]::Escape($test)){throw "Missing v9 display update: $test"}}
          if($source -match 'MaximizedBounds'){throw 'Protected MaximizedBounds property reappeared'}
      - name: Build Windows EXE
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Install-Module ps2exe -Scope CurrentUser -Force
          & ./Build-TayTweaks-EXE.ps1
          if(!(Test-Path TayTweaks.exe)){throw 'EXE missing'}
          Get-FileHash TayTweaks.exe -Algorithm SHA256 | Format-List
      - name: Package v9 test files
        shell: pwsh
        run: |
          Compress-Archive -Path TayTweaks.exe,TayUpdater.ps1,TayTweaks.ico -DestinationPath TayTweaks-v9-PROCESS-TEST.zip -Force
      - name: Upload v9 test package
        uses: actions/upload-artifact@v4
        with:
          name: TayTweaks-v9-PROCESS-TEST
          path: TayTweaks-v9-PROCESS-TEST.zip
          if-no-files-found: error
