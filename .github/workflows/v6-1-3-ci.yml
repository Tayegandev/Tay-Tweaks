name: Tay Tweaks v6.1.3 CI
on:
  push:
    branches:
      - v6.1.4-ui-performance-fix
  pull_request:
    paths:
      - 'TayTweaks.ps1'
      - 'Build-TayTweaks-EXE.ps1'
      - '.github/workflows/v6-1-3-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-and-validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate PowerShell source and tweak catalogue
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          foreach($path in @('./TayTweaks.ps1','./Build-TayTweaks-EXE.ps1','./TayUpdater.ps1')) {
            $tokens=$null;$errors=$null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path),[ref]$tokens,[ref]$errors)
            if($errors.Count -gt 0){ $errors | Format-List | Out-String | Write-Host; throw "PowerShell parser rejected $path" }
          }
          $raw=Get-Content ./TayTweaks.ps1 -Raw
          $all=[regex]::Matches($raw,'\bId\s*=\s*["''][^"'']+["'']')
          $new=[regex]::Matches($raw,'\bId\s*=\s*["'']t613_[^"'']+["'']')
          if($new.Count -ne 60){throw "Expected 60 v6.1.3 tweaks, found $($new.Count)"}
          if($all.Count -ne 113){throw "Expected 113 tweak IDs, found $($all.Count)"}
          $ids=@($all | ForEach-Object {$_.Value.Split('=')[1].Trim().Trim('"',"'")})
          if(@($ids|Select-Object -Unique).Count -ne 113){throw 'Duplicate tweak ID detected'}
          if($raw -notmatch '\$script:AppVersion=\[version\]''6\.1\.4'''){throw 'App version missing or incorrect'}
          Write-Host "Validated $($all.Count) unique tweak IDs and scripts."
      - name: Build EXE with PS2EXE
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Install-Module ps2exe -Scope CurrentUser -Force
          & ./Build-TayTweaks-EXE.ps1
          if(!(Test-Path ./TayTweaks.exe)){throw 'EXE build failed'}
      - name: SHA-256 report
        shell: pwsh
        run: |
          Get-FileHash ./TayTweaks.exe -Algorithm SHA256 | Format-List
      - name: Upload test build
        uses: actions/upload-artifact@v4
        with:
          name: TayTweaks-v6.1.4-test-build
          path: |
            TayTweaks.exe
            TayUpdater.ps1
            TayTweaks.ico
          if-no-files-found: error
